name: igetget
description: >-
  igetget is the English name for 得到 (Dedao), a Chinese knowledge-service and lifelong-learning
  platform operated by Beijing Siwei Zaowu Information Technology Co., Ltd. (北京思维造物信息科技股份有限公司),
  the company behind Luojisiwei (罗辑思维) founded by Luo Zhenyu. The app sells curated courses,
  expert lectures, ebooks, and audiobooks across finance, economics, law, management, psychology,
  and self-improvement, alongside an enterprise edition, a web edition, and the annual "Time's
  Friend" (时间的朋友) New Year's Eve lecture. It is a consumer content product; enrichment found no
  public API specification or developer documentation, only an open-platform (开放平台) login surface
  at open.igetget.com. Backed by Qiming Venture Partners.
